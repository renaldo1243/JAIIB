<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone-first drill app; home = today card + chapter ledger; quiz = one question at a time with instant explanation */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#132a2a; --muted:#5b6d6c; --line:#d3dcda;
  --accent:#0d6b5f; --accent-ink:#ffffff; --gold:#c98a12; --good:#1f7a3a; --good-bg:#e3f3e7; --bad:#b4322b; --bad-bg:#fbe7e5; --chip:#e2ebe9;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172221; --ink:#e4eeec; --muted:#93a6a3; --line:#2b3a38; --accent:#3fb3a2; --accent-ink:#06201c; --gold:#e8b04a; --good:#5cc27a; --good-bg:#16301f; --bad:#ef7b72; --bad-bg:#3a1b19; --chip:#22302e; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716; --surface:#172221; --ink:#e4eeec; --muted:#93a6a3; --line:#2b3a38; --accent:#3fb3a2; --accent-ink:#06201c; --gold:#e8b04a; --good:#5cc27a; --good-bg:#16301f; --bad:#ef7b72; --bad-bg:#3a1b19; --chip:#22302e; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.count{display:flex;gap:8px;flex-wrap:wrap}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:.8rem;color:var(--muted)}
.cd b{color:var(--ink);font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.today{border:2px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--chip);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:1.15rem}
.stat span{font-size:.72rem;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.opt:disabled{opacity:1}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:6px 12px;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ledger{display:flex;flex-direction:column}
.mod{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ch .code{font-family:var(--mono);font-size:.8rem;background:var(--chip);border-radius:6px;padding:2px 6px;min-width:3.2em;text-align:center}
.ch .name{min-width:0}
.ch .name div{font-size:.95rem}
.bar{height:5px;background:var(--chip);border-radius:3px;margin-top:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .s{background:var(--good)} .bar .l{background:var(--gold)} .bar .w{background:var(--bad)}
.ch .act{display:flex;gap:6px}
.ch .act button{padding:5px 9px;font-size:.8rem}
.studied[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stem{font-size:1.05rem;white-space:pre-line}
.tag{font-family:var(--mono);font-size:.75rem;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:2em 1fr;gap:6px;text-align:left;align-items:start;padding:12px}
.opt .l{font-family:var(--mono);font-weight:500;color:var(--muted)}
.opt.right{background:var(--good-bg);border-color:var(--good);border-width:2px}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);border-width:2px}
.opt.right .l{color:var(--good)} .opt.wrong .l{color:var(--bad)}
.exp{border-left:4px solid var(--good);background:var(--chip);border-radius:0 10px 10px 0;padding:12px;display:flex;flex-direction:column;gap:6px}
.exp.bad{border-left-color:var(--bad)}
.exp p{margin:0}
.verdict{font-family:var(--display);font-weight:800;font-size:1.1rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.rem{color:var(--accent);font-weight:600}
label.guess{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.result-big{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1}
.list{display:flex;flex-direction:column;gap:6px}
.wrongitem{display:flex;gap:8px;align-items:baseline;font-size:.92rem}
.note{font-size:.82rem;color:var(--muted)}
.banner{background:var(--chip);border-radius:8px;padding:8px 12px;font-size:.85rem}

/* notes */
.notes{display:flex;flex-direction:column;gap:10px}
.notes h3{font-size:1.05rem;margin-top:6px}
.notes p,.notes ul{margin:0}
.notes ul{padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.notes table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
.notes th{background:var(--chip);text-align:left}
.notes th,.notes td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.notes .box{background:var(--chip);border-radius:8px;padding:10px 12px}
.notes .box.key{border-left:4px solid var(--accent)}
.notes .box.trap{border-left:4px solid var(--bad);background:var(--bad-bg)}
.notes .tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.notes .tag.new{background:var(--gold);color:#1b1300}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* mock */
.timer{font-family:var(--mono);font-size:1rem;padding:4px 10px;border-radius:8px;background:var(--chip)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{padding:5px 0;font-family:var(--mono);font-size:.75rem;border-radius:6px}
.grid button.ans{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid button.flag{outline:2px solid var(--gold);outline-offset:-2px}
.grid button.cur{border:2px solid var(--ink)}
.opt.sel{border:2px solid var(--accent);background:var(--chip)}
@media (max-width:540px){.ch{grid-template-columns:auto 1fr}.ch .act{grid-column:2}}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)} h1{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pyq{display:inline-block;margin:8px 0 2px;padding:3px 9px;border-radius:6px;font-size:.8rem;font-weight:700;background:#fff3cd;color:#7a4b00;border:1px solid #f0c36d}
.srcl{margin:8px 0 2px;font-size:.78rem;color:var(--muted,#667)}
</style>
</head><body>
<div class="wrap" id="app">
  <header>
    <div><div class="eyebrow">JAIIB Nov 2026</div><h1 id="ttl">RBWM Prep</h1><div class="tabs" id="subj" style="margin-top:8px"></div></div>
    <div class="count" id="count"></div>
  </header>
  <div class="card"><p class="muted" style="margin:0">Loading your question bank…</p></div>
</div>

<script>
const SUBJ={
RBWM:{name:'RBWM Prep',bank:'bank.json',notes:'notes.json',ls:'jaiib-drill-v1',app:'rbwm-prep',file:'rbwm-progress',
CH:{A1:'Retail Banking: Introduction',A2:'Role within the Bank — Business Models',A3:'Retail vs Corporate Banking',A4:'Branch Profitability',
B1:'Customer Requirements',B2:'Product Development Process',B3:'Credit Scoring & Types of Risk',B4:'Retail Liability Products (Deposits)',B5:'Retail Asset Products',B6:'Credit & Debit Cards',B7:'Remittance Products / Payment Systems',B8:'Digitisation of Retail Products',B9:'Role of AI & Technology',B10:'Recovery of Retail Loans',B11:'Management Information Systems',B12:'Securitisation',
C1:'Marketing: Introduction',C2:'Delivery Channels',C3:'Delivery Models',C4:'Customer Relationship Management',C5:'Service Standards — BCSBI, Ombudsman',C6:'Marketing Information Systems',
D1:'Importance of Wealth Management',D2:'Investment Management & PMS',D3:'Tax Planning',D4:'Other Financial Services',
E1:'Home Loan Appraisal & Mortgage',E2:'Tax Benefits of Home Loans',E3:'Mortgage Advice & EMI Maths',E4:'Valuation & Reverse Mortgage'},
MODS:[['A','Module A — Retail Banking'],['B','Module B — Retail Products & Recovery'],['C','Module C — Marketing & Support Services'],['D','Module D — Wealth Management'],['E','Home Loans — Additional Reading']],
W:{A:12,B:42,C:12,D:16,E:18}},
IEIFS:{name:'IE & IFS Prep',bank:'bank_ieifs.json',notes:'notes_ieifs.json',ls:'jaiib-ieifs-v1',app:'ieifs-prep',file:'ieifs-progress',
CH:{A1:'Overview of Indian Economy',A2:'Sectors of the Economy',A3:'Economic Planning & NITI Aayog',A4:'PSL & MSME',A5:'Infrastructure',A6:'Globalisation & Protectionism',A7:'Economic Reforms 1991',A8:'FDI/FII, Trade Policy, Growth vs Development',A9:'International Organisations (IMF, WB, WTO)',A10:'CSR, SDGs, Climate & ESG',
B1:'Economics Fundamentals & Economy Types',B2:'Demand & Supply',B3:'Money Supply & Inflation',B4:'Interest Theories & IS-LM',B5:'Business Cycle',B6:'Monetary Policy & RBI Tools',B7:'National Income / GDP',B8:'Fiscal Policy & Budget',
C1:'IFS Overview & Banking History',C2:'Banking Structure (RRB/UCB/PB/SFB)',C3:'RBI Act & BR Act',C4:'Development Financial Institutions',C5:'Microfinance & SHGs',C6:'NBFCs',C7:'Insurance Sector & IRDAI',C8:'Financial Regulators',C9:'NaBFID & Bad Bank (NARCL)',C10:'Banking Reforms & Committees',
D1:'Money Market',D2:'Capital Market',D3:'Government Securities',D4:'Forex Market, FEMA & Benchmarks',D5:'Merchant Banking',D6:'Derivatives',D7:'Factoring, Forfaiting & TReDS',D8:'Venture Capital',D9:'Leasing & Hire Purchase',D10:'Credit Rating & CICs',D11:'Mutual Funds',D12:'Insurance Products & Govt Schemes',D13:'Pension & Small Savings',D14:'Financial Markets — Features',D15:'REITs & InvITs',D16:'Para-Banking & Financial Services by Banks'},
MODS:[['A','Module A — Indian Economic Architecture'],['B','Module B — Economic Concepts, Monetary & Fiscal'],['C','Module C — Indian Financial Architecture'],['D','Module D — Financial Products & Services']],
W:{A:23,B:22,C:21,D:34}}};
const EXAMS=[['IE & IFS','2026-11-01'],['AFM / RBWM','2026-11-28']];
let SUB='IEIFS'; try{const x=localStorage.getItem('jaiib-subject'); if(x&&SUBJ[x]) SUB=x}catch(e){}
let CH=SUBJ[SUB].CH, MODS=SUBJ[SUB].MODS, MOCK_W=SUBJ[SUB].W;
const MOCK_N=100, MOCK_MIN=120;
const INTERVALS=[1,3,7,14,30];
const DAILY=15, MAXDUE=10, TOPIC=10;

let BANK=[], BYID={}, S=null, db=null, saving=Promise.resolve(), view='home', Q=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function daysTo(s){const [y,m,d]=s.split('-').map(Number);const [a,b,c]=today().split('-').map(Number);return Math.round((new Date(y,m-1,d)-new Date(a,b-1,c))/864e5)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function blank(){return {studied:[],cards:{},sessions:[],current:null,v:1}}

// ---------- storage ----------
let LS=SUBJ[SUB].ls;
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let dirty=false, writing=false, uid=null, USER=null, PARTNERS=[];
function save(){lsSet()}
let syncMsg='';
function setSync(m){syncMsg=m; const el=$('#sync'); if(el) el.textContent=m}

async function boot(){
  renderSubj(); renderCount();
  const BF=SUBJ[SUB].bank; BANK=[]; BYID={};
  try{const r=await fetch(BF,{cache:'no-cache'}); BANK=await r.json()}catch(e){try{const r=await fetch(BF); BANK=await r.json()}catch(e2){$('#app').innerHTML+='<div class="card">Could not load the questions. Connect to the internet once and reopen the app.</div>';return}}
  BANK.forEach(q=>BYID[q.id]=q);
  S=Object.assign(blank(),lsGet()||{});
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
  setSync('Progress is saved on this phone. Use Backup now and then so nothing is lost.');
  render();
}

// ---------- scheduling ----------
function card(id){return S.cards[id]}
function isDue(id){const c=card(id);return c&&c.d<=today()}
function chStats(ch){
  const qs=BANK.filter(q=>q.ch===ch); let solid=0,learn=0,weak=0,seen=0;
  qs.forEach(q=>{const c=card(q.id); if(!c) return; seen++; if(c.b>=3) solid++; else if(c.lw) weak++; else learn++});
  return {n:qs.length,seen,solid,learn,weak};
}
function dueList(){return BANK.filter(q=>isDue(q.id)).sort((a,b)=>card(a.id).d<card(b.id).d?-1:1)}
function newList(chs){return BANK.filter(q=>chs.includes(q.ch)&&!card(q.id))}
function interleave(qs){ // spread chapters
  const g={}; shuffle(qs).forEach(q=>(g[q.ch]=g[q.ch]||[]).push(q));
  const keys=shuffle(Object.keys(g)); const out=[]; let more=true;
  while(more){more=false; keys.forEach(k=>{if(g[k].length){out.push(g[k].shift());more=true}})}
  return out;
}
function buildDaily(){
  const due=dueList().slice(0,MAXDUE);
  const fresh=interleave(newList(S.studied)).filter(q=>!due.includes(q)).slice(0,DAILY-due.length);
  let qs=due.concat(fresh);
  if(qs.length<DAILY){ // top up with weakest seen questions from studied chapters
    const pool=BANK.filter(q=>S.studied.includes(q.ch)&&card(q.id)&&!qs.includes(q)).sort((a,b)=>(card(a.id).b-card(b.id).b));
    qs=qs.concat(pool.slice(0,DAILY-qs.length));
  }
  return {due:due.length,fresh:fresh.length,qs:shuffle(qs).map(q=>q.id)};
}
function buildTopic(ch){
  const all=BANK.filter(q=>q.ch===ch);
  const unseen=shuffle(all.filter(q=>!card(q.id)));
  const weak=shuffle(all.filter(q=>card(q.id)&&card(q.id).b<3));
  const rest=shuffle(all.filter(q=>card(q.id)&&card(q.id).b>=3));
  return unseen.concat(weak,rest).map(q=>q.id); // whole chapter in one round
}
function buildNew(ch){
  const all=BANK.filter(q=>/^IE-G-/.test(q.id)&&(!ch||q.ch===ch));
  const unseen=all.filter(q=>!card(q.id)), weak=shuffle(all.filter(q=>card(q.id)&&card(q.id).b<3));
  const pick=ch?shuffle(unseen):interleave(unseen.filter(q=>!S.studied.length||S.studied.includes(q.ch))).concat(shuffle(unseen));
  return ch?[...new Set(pick.concat(weak,shuffle(all)))].map(q=>q.id):[...new Set(pick.concat(weak))].slice(0,20).map(q=>q.id);
}
function newCardHtml(){
  const all=BANK.filter(q=>/^IE-G-/.test(q.id)); if(!all.length) return '';
  const left=all.filter(q=>!card(q.id)).length;
  return `<section class="card"><div class="eyebrow">Beyond past papers</div><h2>New-angle questions</h2><p style="margin:0">${all.length} questions on facts that past papers have <b>not</b> asked yet — the likely new questions. <b>${left}</b> not tried yet.</p><div class="row"><button class="primary" id="newall">Practise 20 new-angle questions</button></div><p class="note">Also available chapter-wise: the “New angle” button next to each chapter.</p></section>`;
}
function mistakes(){return BANK.filter(q=>{const c=card(q.id);return c&&c.lw})}

function grade(id,ok,guessed){
  const t=today(); const c=S.cards[id]||{b:0,r:0,w:0};
  if(ok&&!guessed){c.b=Math.min((c.lw?0:c.b)+1,INTERVALS.length-1); c.r++; c.lw=false; c.d=addDays(t,INTERVALS[c.b])}
  else{c.b=0; if(ok) c.r++; else c.w++; c.lw=true; c.d=addDays(t,1)}
  c.t=t; S.cards[id]=c;
}


// ---------- notes ----------
let NOTES=null;
async function notesView(ch){
  view='notes'; window.scrollTo(0,0);
  const app=$('#app'); const hdr=app.querySelector('header').outerHTML;
  if(!NOTES){app.innerHTML=hdr+'<div class="card">Loading notes…</div>'; try{NOTES=await (await fetch(SUBJ[SUB].notes)).json()}catch(e){app.innerHTML=hdr+'<div class="card">Could not load the notes. Check your connection and try again. <button id="home">Back</button></div>'; on2('home',render); return}}
  const keys=Object.keys(CH); const i=keys.indexOf(ch); const prev=keys[i-1], next=keys[i+1];
  const st=S.studied.includes(ch); const s=chStats(ch);
  const html=(NOTES[ch]||'<p>No notes for this chapter.</p>').replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>');
  app.innerHTML=hdr+`<section class="card"><div class="navrow"><button class="ghost small" id="home">← All chapters</button><span class="tag">${ch} · ${s.n} questions</span></div>
  <h2>${esc(ch)} — ${esc(CH[ch])}</h2><div class="notes">${html}</div>
  <div class="row"><button class="primary" id="prac">Practise ${ch} now</button><button class="studied" id="mk" aria-pressed="${st}">${st?'✓ Studied — in daily quiz':'Mark studied'}</button></div>
  <div class="navrow">${prev?`<button class="ghost" id="prev">← ${prev}</button>`:'<span></span>'}${next?`<button class="ghost" id="next2">${next} →</button>`:''}</div></section>`;
  on2('home',render); on2('prev',()=>notesView(prev)); on2('next2',()=>notesView(next));
  on2('prac',()=>start('topic',buildTopic(ch),ch));
  on2('mk',()=>{const k=S.studied.indexOf(ch); if(k<0) S.studied.push(ch); else S.studied.splice(k,1); save(); notesView(ch)});
}
// ---------- mock test ----------
function mockCardHtml(){
  const m=S.mock; const last=(S.mocks||[]).slice(-3).reverse();
  const body=m&&!m.done?`<p style="margin:0">Mock in progress — <b>${Object.keys(m.ans).length}/${m.ids.length}</b> answered, ${fmtLeft(m.end-Date.now())} left.</p><div class="row"><button class="primary" id="mockresume">Resume mock</button></div>`
   :`<p style="margin:0">${MOCK_N} questions · ${MOCK_MIN} minutes · all modules, weighted like recent papers · no answers until you submit · no negative marking. Pass mark 50; aim for 70.</p><div class="row"><button id="mock">Start a full mock</button></div>`;
  return `<section class="card"><h2>Full mock test</h2>${body}${last.length?`<div class="list">${last.map(x=>`<div class="wrongitem"><span class="mono">${x.t.slice(5)}</span><span>Mock</span><b class="mono" style="margin-left:auto;color:${x.c>=70?'var(--good)':x.c>=50?'var(--gold)':'var(--bad)'}">${x.c}/${x.n}</b></div>`).join('')}</div>`:''}</section>`;
}

function qtype(q){
  const s=q.s;
  if(/^Match/i.test(s)||/\bMatch\b.*:/.test(s)) return 'Match the following';
  if(/^Consider/i.test(s)||/Which (of the above |of these )?(are|is) (correct|incorrect)/i.test(s)||/\n1\./.test(s)) return 'Statement-based';
  if(/(₹|%|\d{2,}).*(calculate|is:|will be|closest|works out|equals|amount|value|EMI|interest)/i.test(s.replace(/\n/g,' '))) return 'Numerical';
  if(/^(Mr\.|Mrs\.|Ms\.|Shri|A customer|A bank|A branch|A borrower|A depositor|An? [a-z-]+ (customer|account|investor)|[A-Z][a-z]+ (has|had|is|wants|opened|took))/.test(s)) return 'Case-based';

}

  <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}" id="opt${i}"><span class="l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="after"></div></section>`;
  $('#quit').onclick=()=>{S.current=Q; save(); render()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q,+b.dataset.i));
}
function answer(q,i){
  const ok=i===q.a;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true; const k=+b.dataset.i; if(k===q.a) b.classList.add('right'); else if(k===i) b.classList.add('wrong')});
  const r={id:q.id,pick:i,ok,g:false}; Q.res.push(r); Q.i++;
  grade(q.id,ok,false); S.current=Q; save();
  $('#after').innerHTML=`<div class="exp ${ok?'':'bad'}">
    <div class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Not quite — answer is '+'ABCD'[q.a]}</div>
    <p><b>Why:</b> ${esc(q.w)}</p>${q.n?`<p><b>Why the others are wrong:</b> ${esc(q.n)}</p>`:''}${q.r?`<p class="rem">Remember: ${esc(q.r)}</p>`:''}
    ${q.note?`<p class="banner small" style="margin:0">⚠ ${esc(q.note)}</p>`:''}<p class="note">${esc(q.id)} · ${esc(q.src||'Practice')}${/^PYQ/.test(q.src||'')?' — memory-based recall, key checked against rules as on 30 Jun 2026':' — original practice question'}</p></div>
    ${ok?`<label class="guess"><input type="checkbox" id="g"> I guessed this one — bring it back tomorrow</label>`:''}
    <div class="row"><button class="primary" id="next">${Q.i<Q.ids.length?'Next question':'See results'}</button></div>`;
  const g=$('#g'); if(g) g.onchange=()=>{r.g=g.checked; const c=S.cards[q.id]; if(g.checked){c.b=0;c.lw=true;c.d=addDays(today(),1)} else {c.lw=false;c.b=Math.max(1,c.b);c.d=addDays(today(),INTERVALS[c.b])} save()};
  $('#next').onclick=quiz; $('#next').focus({preventScroll:true});
}
function finish(){
  const app=$('#app'); const hdr=app.querySelector('header').outerHTML;
  const n=Q.res.length, c=Q.res.filter(r=>r.ok&&!r.g).length;
  S.sessions.push({t:Q.t,m:Q.m,ch:Q.ch,n,c,wrong:Q.res.filter(r=>!r.ok||r.g).map(r=>r.id)});
  if(S.sessions.length>300) S.sessions=S.sessions.slice(-300);
  S.current=null; save();
  const byCh={}; Q.res.forEach(r=>{const ch=BYID[r.id].ch; byCh[ch]=byCh[ch]||[0,0]; byCh[ch][1]++; if(r.ok&&!r.g) byCh[ch][0]++});
  const wrong=Q.res.filter(r=>!r.ok||r.g);
  const pct=n?Math.round(100*c/n):0;
  app.innerHTML=hdr+`<section class="card today"><div class="eyebrow">Round complete</div>
  <div class="row" style="align-items:baseline"><span class="result-big mono">${c}/${n}</span><span class="muted">${pct}% · target 70%+</span></div>
  <p style="margin:0">${pct>=70?'On target. Wrong and guessed questions come back tomorrow.':'Below target. Re-read the notes for the chapters below, then the wrong ones come back tomorrow.'}</p>
  <div class="list">${Object.entries(byCh).map(([ch,[a,b]])=>`<div class="wrongitem"><span class="code mono">${ch}</span><span>${esc(CH[ch]||'')}</span><b class="mono" style="margin-left:auto;color:${a===b?'var(--good)':'var(--bad)'}">${a}/${b}</b></div>`).join('')}</div>
  <div class="row"><button class="primary" id="home">Back to home</button>${wrong.length?`<button id="redo">Retry the ${wrong.length} wrong now</button>`:''}</div></section>
  ${wrong.length?`<section class="card"><h2>To fix</h2><div class="list">${wrong.map(r=>{const q=BYID[r.id];return `<div><div class="note">${esc(q.id)} · ${r.ok?'guessed':'you chose '+'ABCD'[r.pick]+', answer '+'ABCD'[q.a]}</div><div class="small">${esc(q.s.split('\n')[0])}</div><div class="small rem">${esc(q.r||q.w)}</div></div>`}).join('')}</div></section>`:''}`;
  $('#home').onclick=render;
  const rd=$('#redo'); if(rd) rd.onclick=()=>start('mistakes',wrong.map(r=>r.id));
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-sub]'); if(b) switchSubj(b.dataset.sub)});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'&&view!=='mock') return;
  const k=e.key.toUpperCase(); const i='ABCD'.indexOf(k);
  if(i>=0&&k.length===1){const b=$('#opt'+i); if(b&&!b.disabled) b.click()}
  if(e.key==='Enter'){const n=$('#next'); if(n) n.click()}
});
boot();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
